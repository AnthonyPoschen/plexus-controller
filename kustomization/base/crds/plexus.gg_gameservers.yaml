---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: gameservers.plexus.gg
spec:
  group: plexus.gg
  names:
    kind: GameServer
    listKind: GameServerList
    plural: gameservers
    shortNames:
    - gs
    singular: gameserver
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.selectedSetup.gameID
      name: Game
      type: string
    - jsonPath: .spec.desiredPower
      name: Desired
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.endpoint
      name: Endpoint
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: GameServer is the Schema for the gameservers API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              GameServerSpec defines the desired runtime state of one stable customer
              Server. A Server may be unloaded by omitting SelectedSetup, but its desired
              power must then remain Stopped.
            properties:
              computePlanID:
                description: ComputePlanID references the purchased base node plan.
                type: string
              desiredPower:
                description: DesiredPower is the customer's durable Running or Stopped
                  intent.
                enum:
                - Running
                - Stopped
                type: string
              highPerformance:
                description: |-
                  HighPerformance enables the plan's additional CPU scheduling priority and
                  memory entitlement without changing its burst CPU ceiling.
                type: boolean
              location:
                description: |-
                  Location is the desired configured location within Region (for example,
                  "sydney").
                type: string
              ownerUserID:
                description: OwnerUserID is the backend user who owns this Server.
                minLength: 1
                type: string
              region:
                description: Region is the desired broad deployment region (for example,
                  "australia").
                type: string
              restartGeneration:
                description: |-
                  RestartGeneration is incremented to request another restart of the same
                  selected setup while leaving DesiredPower Running.
                format: int64
                minimum: 0
                type: integer
              selectedSetup:
                description: |-
                  SelectedSetup is the one saved setup this Server will run. It is omitted
                  when the Server is unloaded; retained setup data remains independent.
                properties:
                  configuration:
                    description: |-
                      Configuration contains structured, non-sensitive values and a reference
                      to this setup's sensitive values.
                    properties:
                      schemaVersion:
                        description: SchemaVersion selects the versioned game-management
                          configuration schema.
                        minLength: 1
                        type: string
                      secretRef:
                        description: |-
                          SecretRef names a Secret in the GameServer namespace that belongs only to
                          this selected setup and conforms to the adapter's versioned secret schema.
                        properties:
                          name:
                            description: Name is the Kubernetes Secret name.
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                      values:
                        description: |-
                          Values contains structured JSON/YAML, not a rendered configuration file.
                          Sensitive values must never be placed here.
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                    required:
                    - schemaVersion
                    - secretRef
                    - values
                    type: object
                  gameID:
                    description: GameID selects the controller-owned game adapter.
                    minLength: 1
                    type: string
                  id:
                    description: ID is the stable backend identifier of the selected
                      saved setup.
                    minLength: 1
                    type: string
                required:
                - configuration
                - gameID
                - id
                type: object
              serverID:
                description: ServerID is the stable identifier from the backend database.
                minLength: 1
                type: string
              shutdownMode:
                description: ShutdownMode selects graceful shutdown or an explicit
                  force-stop intent.
                enum:
                - Graceful
                - Force
                type: string
            required:
            - desiredPower
            - ownerUserID
            - serverID
            - shutdownMode
            type: object
            x-kubernetes-validations:
            - message: desiredPower must be Stopped when selectedSetup is omitted
              rule: has(self.selectedSetup) || self.desiredPower == 'Stopped'
          status:
            description: GameServerStatus defines the controller's latest observed
              runtime state.
            properties:
              activeSetupID:
                description: ActiveSetupID is the setup the runtime has actually activated.
                type: string
              conditions:
                description: |-
                  Conditions represent the latest observations of individual runtime
                  concerns.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoint:
                description: Endpoint is the public address players can connect to
                  when available.
                type: string
              lastObservedAt:
                description: LastObservedAt is when this status was last refreshed
                  from runtime state.
                format: date-time
                type: string
              message:
                description: Message is a human-readable explanation of the current
                  state.
                type: string
              observedGeneration:
                description: ObservedGeneration is the latest GameServer metadata
                  generation observed.
                format: int64
                minimum: 0
                type: integer
              observedRestartGeneration:
                description: ObservedRestartGeneration is the latest restart request
                  observed.
                format: int64
                minimum: 0
                type: integer
              phase:
                description: Phase is the observed lifecycle phase, independent of
                  desired power.
                enum:
                - Unknown
                - Provisioning
                - Stopped
                - Starting
                - Running
                - Stopping
                - Failed
                type: string
              players:
                description: |-
                  Players is the latest observed connected-player count. Nil means the
                  controller did not observe a count.
                format: int32
                minimum: 0
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
