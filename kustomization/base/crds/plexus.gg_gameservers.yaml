---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: gameservers.plexus.gg
spec:
  group: plexus.gg
  names:
    kind: GameServer
    listKind: GameServerList
    plural: gameservers
    shortNames:
    - gs
    singular: gameserver
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.gameID
      name: Game
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.endpoint
      name: Endpoint
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: GameServer is the Schema for the gameservers API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              GameServerSpec defines the desired state of GameServer.

              Most game-specific defaults (image, environment, minimum disk, config templates,
              which paths are raw-disk-only, etc.) live in the controller's internal game
              definitions (see internal/games in the controller repo). The controller applies
              these at reconciliation / creation time.

              The CRD stays relatively small and generic. Game-specific user choices go
              into GameConfig.
            properties:
              computePlanID:
                description: |-
                  ComputePlanID references the purchased base node plan.
                  The controller uses this + HighPerformance + the game definition to
                  determine final resource requests (including disk at spin-up time).
                type: string
              highPerformance:
                description: |-
                  HighPerformance enables the plan's additional CPU scheduling priority and
                  memory entitlement without changing its burst CPU ceiling.
                type: boolean
              gameConfig:
                additionalProperties:
                  type: string
                description: |-
                  GameConfig holds user-provided, game-specific settings.
                  The controller looks up the GameDefinition for spec.gameID and uses its
                  ConfigLayer templates to turn these values into ConfigMaps (the preferred
                  "config layer").
                type: object
              gameID:
                description: GameID identifies which game (e.g. "factorio", "project-zomboid").
                type: string
              image:
                description: |-
                  Image allows overriding the container image the controller would normally
                  choose for this gameID.
                type: string
              location:
                description: |-
                  Location is the desired configured location within Region (for example,
                  "sydney"). Admin assignments may use configured testing locations before
                  they become publicly available.
                type: string
              ownerUserID:
                description: OwnerUserID is the backend user who owns this server.
                type: string
              region:
                description: Region is the desired broad deployment region (for example, "australia").
                type: string
              serverID:
                description: ServerID is the stable identifier from the backend database.
                type: string
              storage:
                description: |-
                  Storage allows the user (or backend) to request a specific persistent
                  volume size. The controller will ensure the final size meets the game's
                  minimums + the compute plan (see internal/games.CalculateDiskSize).
                properties:
                  size:
                    type: string
                type: object
            required:
            - gameID
            - ownerUserID
            - serverID
            type: object
          status:
            description: GameServerStatus defines the observed state of GameServer.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the GameServer's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              endpoint:
                description: Endpoint is the public address players can connect to
                  (if running).
                type: string
              lastReadyAt:
                description: LastReadyAt is when the game server last reported as
                  ready/healthy.
                format: date-time
                type: string
              message:
                description: Message is a human-readable explanation of the current
                  state.
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation the
                  controller has observed.
                format: int64
                type: integer
              phase:
                description: Phase is a high-level summary of where the GameServer
                  is in its lifecycle.
                enum:
                - Pending
                - Running
                - Stopped
                - Failed
                - EditorActive
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
