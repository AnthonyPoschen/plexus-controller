apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Rewrite the generated plexus.gg CRDs at apply time. Do not commit a second
# Dev CRD file. Cluster-level Flux applies this overlay; tenant SAs do not.
resources:
  - ../../base

namespace: app-plexus-dev

patches:
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: gameservers.plexus.gg
    patch: |-
      - op: replace
        path: /metadata/name
        value: gameservers.dev.plexus.gg
      - op: replace
        path: /spec/group
        value: dev.plexus.gg
      - op: remove
        path: /spec/names/shortNames
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: saveexports.plexus.gg
    patch: |-
      - op: replace
        path: /metadata/name
        value: saveexports.dev.plexus.gg
      - op: replace
        path: /spec/group
        value: dev.plexus.gg
      - op: remove
        path: /spec/names/shortNames
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: saveimports.plexus.gg
    patch: |-
      - op: replace
        path: /metadata/name
        value: saveimports.dev.plexus.gg
      - op: replace
        path: /spec/group
        value: dev.plexus.gg
      - op: remove
        path: /spec/names/shortNames
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: Role
      name: plexus-controller
    patch: |-
      - op: replace
        path: /rules/7/apiGroups/0
        value: dev.plexus.gg
      - op: replace
        path: /rules/8/apiGroups/0
        value: dev.plexus.gg
      - op: replace
        path: /rules/9/apiGroups/0
        value: dev.plexus.gg
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRole
      name: plexus-controller-crd-reader
    patch: |-
      - op: replace
        path: /metadata/name
        value: plexus-controller-crd-reader-dev
      - op: replace
        path: /rules/0/resourceNames/0
        value: gameservers.dev.plexus.gg
