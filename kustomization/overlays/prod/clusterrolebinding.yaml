apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: plexus-controller-crd-reader
  labels:
    app.kubernetes.io/name: plexus-controller
    app.kubernetes.io/component: manager
  annotations:
    # Source for the prod overlay replacement that keeps Role/RoleBinding
    # in app-plexus after the namespace transformer.
    plexus.gg/runtime-namespace: app-plexus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: plexus-controller-crd-reader
subjects:
  - kind: ServiceAccount
    name: plexus-controller
    namespace: app-plexus-controller
