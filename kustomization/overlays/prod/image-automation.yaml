---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: plexus-controller
  namespace: app-plexus-controller
spec:
  image: ghcr.io/anthonyposchen/plexus-controller
  interval: 1m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: plexus-controller
  namespace: app-plexus-controller
spec:
  imageRepositoryRef:
    name: plexus-controller
  filterTags:
    pattern: "^master-[a-f0-9]{7}-(?P<timestamp>[0-9]{14})$"
    extract: "$timestamp"
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: plexus-controller
  namespace: app-plexus-controller
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: app-plexus-controller
    namespace: flux-system
  git:
    checkout:
      ref:
        branch: master
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: "chore(images): update plexus-controller image"
    push:
      branch: master
  update:
    path: ./kustomization/overlays/prod
    strategy: Setters
