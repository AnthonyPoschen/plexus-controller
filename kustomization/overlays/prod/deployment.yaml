apiVersion: apps/v1
kind: Deployment
metadata:
  name: plexus-controller
  labels:
    app.kubernetes.io/name: plexus-controller
    app.kubernetes.io/component: manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plexus-controller
      app.kubernetes.io/component: manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plexus-controller
        app.kubernetes.io/component: manager
    spec:
      serviceAccountName: plexus-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: manager
          image: controller
          args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          env:
            - name: PLEXUS_API_GROUP
              value: plexus.gg
            - name: PLEXUS_RUNTIME_NAMESPACE
              value: app-plexus
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
