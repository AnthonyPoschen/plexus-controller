name: Controller image

on:
  push:
    branches: ["master"]
    paths:
      - "cmd/manager/**"
      - "internal/**"
      - "api/**"
      - "pkg/**"
      - "Dockerfile"
      - ".github/workflows/controller-image.yml"
      - "go.mod"
      - "go.sum"
      - "vendor/**"
  pull_request:
    paths:
      - "cmd/manager/**"
      - "internal/**"
      - "api/**"
      - "pkg/**"
      - "Dockerfile"
      - ".github/workflows/controller-image.yml"
      - "go.mod"
      - "go.sum"
      - "vendor/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: anthonyposchen/plexus-controller

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: image-tag
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          short_sha="${GITHUB_SHA::7}"
          built_at="$(date -u +%Y%m%d%H%M%S)"
          echo "moving=${branch}-${short_sha}-${built_at}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.image-tag.outputs.moving }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable=true,priority=100,prefix=sha-,format=short

      - name: Build and push controller manager image
        uses: docker/build-push-action@v6
        with:
          file: ./Dockerfile
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
